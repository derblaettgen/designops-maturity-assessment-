name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy versioned systemd release
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu

            SOURCE_DIR=/srv/apps/designops/source

            case "$DEPLOY_SHA" in
              ''|*[!0-9a-f]*) echo "Invalid deployment SHA"; exit 1 ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "Deployment SHA must contain 40 hexadecimal characters"
              exit 1
            fi
            if [ ! -d "$SOURCE_DIR/.git" ]; then
              echo "Missing bootstrapped deployment checkout: $SOURCE_DIR"
              exit 1
            fi

            git -C "$SOURCE_DIR" fetch --prune origin main
            git -C "$SOURCE_DIR" checkout --detach "$DEPLOY_SHA"
            test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$DEPLOY_SHA"

            exec bash "$SOURCE_DIR/ops/deploy-vps.sh" "$DEPLOY_SHA"
